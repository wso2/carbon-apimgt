openapi: 3.0.3
info:
  title: Google Vertex AI - Gemini API
  description: |-
    This OpenAPI specification defines the RESTful API for invoking Google Gemini
    models hosted on Google Vertex AI, via the custom methods on the `publishers/google`
    model resource: `generateContent` and `streamGenerateContent` (text generation),
    `countTokens` and `computeTokens` (tokenization), `embedContent` (embeddings), and the
    generic `predict` / `serverStreamingPredict` methods (used by predict-based Google
    models such as Imagen - not by Gemini text generation).

    Note: the streaming methods (`streamGenerateContent`, `serverStreamingPredict`) are not
    delivered incrementally on the WSO2 API Manager Classic Gateway - the response is
    buffered and returned as a whole.

    **Vertex-specific notes:**
    - The target model is identified in the **URL path**
      (`.../models/{model}:generateContent`), not in the request body.
    - Authentication uses a Google service-account OAuth2 bearer token
      (`Authorization: Bearer <token>`), generated by the gateway - not a static API key.
    - `project` and `location` are tenant-specific and are supplied as endpoint
      configuration, hence surfaced here as path/server variables.
    - The response body carries token usage under `usageMetadata`, identical to the
      public Gemini API.
    - `project`, `location` and `publisher` are baked into the backend endpoint URL below,
      so API consumers never see them - they only send `{model}:generateContent`.
    - Edit the endpoint URL: replace `{project_id}` with your GCP project and `{region}`
      (the region prefix and the `locations` segment) with your model's location.
  version: "v1"
servers:
  # Full backend base for your deployment. This whole URL is the endpoint the gateway calls;
  # the resource path "/{model}:generateContent" is appended to it. Replace the {project_id} and
  # {region} placeholders (region appears twice) with your GCP project and model location.
  # The gateway seeds this URL verbatim and does not resolve the server variables below, so the
  # placeholders are shown as-is for you to edit (the variable defaults are informational only).
  - url: https://{region}-aiplatform.googleapis.com/v1/projects/{project_id}/locations/{region}/publishers/google/models
    variables:
      region:
        default: us-central1
        description: "The Vertex AI region (appears in the host prefix and the locations path segment)."
      project_id:
        default: your-project-id
        description: "Your GCP project ID."
paths:
  /{model}:generateContent:
    post:
      operationId: GenerateContent
      summary: Generate content with a Gemini model (unary)
      description: |-
        Sends a content-generation request to the specified Gemini model on Vertex AI
        and returns the complete response in a single payload.
      parameters:
        - name: model
          in: path
          required: true
          description: "The Gemini model identifier, e.g. `gemini-2.5-pro`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContentRequest'
            example:
              contents:
                - role: user
                  parts:
                    - text: "Explain what Vertex AI is in one sentence."
              generationConfig:
                temperature: 0.2
                maxOutputTokens: 256
      responses:
        '200':
          description: Successful response from the model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateContentResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{model}:streamGenerateContent:
    post:
      operationId: StreamGenerateContent
      summary: Generate content with a Gemini model (streaming)
      description: |-
        Sends a content-generation request to the specified Gemini model on Vertex AI
        and receives the response as a stream of `GenerateContentResponse` chunks.
      parameters:
        - name: model
          in: path
          required: true
          description: "The Gemini model identifier, e.g. `gemini-2.5-pro`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContentRequest'
            example:
              contents:
                - role: user
                  parts:
                    - text: "Explain what Vertex AI is in one sentence."
              generationConfig:
                temperature: 0.2
                maxOutputTokens: 256
      responses:
        '200':
          description: Successful streaming response from the model.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenerateContentResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{model}:countTokens:
    post:
      operationId: CountTokens
      summary: Count tokens for a Gemini model request
      description: |-
        Returns the number of tokens the given content would consume for the specified
        Gemini model, without running generation. The model is identified in the URL path.
      parameters:
        - name: model
          in: path
          required: true
          description: "The Gemini model identifier, e.g. `gemini-2.5-pro`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContentRequest'
            example:
              contents:
                - role: user
                  parts:
                    - text: "Explain what Vertex AI is in one sentence."
      responses:
        '200':
          description: Token count for the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountTokensResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{model}:computeTokens:
    post:
      operationId: ComputeTokens
      summary: Compute token IDs for a Gemini model request
      description: |-
        Returns the tokenization (token byte strings and numeric token IDs) of the given
        content for the specified Gemini model. The model is identified in the URL path.
      parameters:
        - name: model
          in: path
          required: true
          description: "The Gemini model identifier, e.g. `gemini-2.5-pro`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContentRequest'
            example:
              contents:
                - role: user
                  parts:
                    - text: "Explain what Vertex AI is in one sentence."
      responses:
        '200':
          description: Tokenization of the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeTokensResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{model}:embedContent:
    post:
      operationId: EmbedContent
      summary: Generate a text embedding with a Gemini embedding model
      description: |-
        Generates an embedding vector for the given content using the specified Gemini
        embedding model (e.g. `gemini-embedding-001`). The model is
        identified in the URL path.
      parameters:
        - name: model
          in: path
          required: true
          description: "The Gemini embedding model identifier, e.g. `gemini-embedding-001`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedContentRequest'
            example:
              content:
                parts:
                  - text: "Vertex AI is a managed machine learning platform."
              taskType: RETRIEVAL_DOCUMENT
      responses:
        '200':
          description: The embedding for the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedContentResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{model}:predict:
    post:
      operationId: Predict
      summary: Run a prediction on a predict-based Vertex publisher model
      description: |-
        Generic Vertex prediction method used by predict-based Google models (e.g. Imagen
        image generation, some embedding models). This is NOT used for Gemini text
        generation - use `:generateContent` for that. The model is identified in the URL path.
      parameters:
        - name: model
          in: path
          required: true
          description: "The publisher model identifier, e.g. `imagen-3.0-generate-002`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
      responses:
        '200':
          description: The prediction result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{model}:serverStreamingPredict:
    post:
      operationId: ServerStreamingPredict
      summary: Run a server-streaming prediction on a predict-based Vertex publisher model
      description: |-
        Server-streaming variant of `:predict` for predict-based Google models. This is NOT
        used for Gemini text generation. Note: streaming is not delivered incrementally on
        the WSO2 Classic Gateway (the response is buffered). The model is identified in the
        URL path.
      parameters:
        - name: model
          in: path
          required: true
          description: "The publisher model identifier."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamingPredictRequest'
      responses:
        '200':
          description: Successful streaming prediction response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StreamingPredictResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    GenerateContentRequest:
      type: object
      description: A Gemini content-generation request (Vertex variant - no model field in body).
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/Content'
          description: The content of the current conversation with the model.
        systemInstruction:
          $ref: '#/components/schemas/Content'
        tools:
          type: array
          items:
            type: object
          description: A list of tools the model may use to generate the next response.
        generationConfig:
          $ref: '#/components/schemas/GenerationConfig'
        safetySettings:
          type: array
          items:
            type: object
      required:
        - contents
    Content:
      type: object
      properties:
        role:
          type: string
          enum: [user, model]
          description: The producer of the content.
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Part'
      required:
        - parts
    Part:
      type: object
      properties:
        text:
          type: string
          description: Inline text.
    GenerationConfig:
      type: object
      properties:
        temperature:
          type: number
          format: float
        topP:
          type: number
          format: float
        topK:
          type: integer
        maxOutputTokens:
          type: integer
        stopSequences:
          type: array
          items:
            type: string
    GenerateContentResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        modelVersion:
          type: string
          description: The model version that generated the response.
        usageMetadata:
          $ref: '#/components/schemas/UsageMetadata'
    Candidate:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/Content'
        finishReason:
          type: string
          enum: [STOP, MAX_TOKENS, SAFETY, RECITATION, OTHER]
        index:
          type: integer
    UsageMetadata:
      type: object
      properties:
        promptTokenCount:
          type: integer
          description: Number of tokens in the prompt.
        candidatesTokenCount:
          type: integer
          description: Number of tokens in the generated candidates.
        totalTokenCount:
          type: integer
          description: Total token count for the request (prompt + candidates).
    CountTokensResponse:
      type: object
      properties:
        totalTokens:
          type: integer
          description: The total number of tokens counted across all supplied content.
        totalBillableCharacters:
          type: integer
          description: The total number of billable characters counted across all supplied content.
        promptTokensDetails:
          type: array
          items:
            type: object
          description: Per-modality breakdown of the counted prompt tokens.
    ComputeTokensResponse:
      type: object
      properties:
        tokensInfo:
          type: array
          items:
            $ref: '#/components/schemas/TokensInfo'
          description: Per-content tokenization information.
    TokensInfo:
      type: object
      properties:
        tokenIds:
          type: array
          items:
            type: string
            format: int64
          description: The numeric IDs of the tokens.
        tokens:
          type: array
          items:
            type: string
            format: byte
          description: The token byte strings.
        role:
          type: string
          description: The role associated with these tokens.
    EmbedContentRequest:
      type: object
      description: A Gemini embedding request (Vertex variant - no model field in body).
      properties:
        content:
          $ref: '#/components/schemas/Content'
        taskType:
          type: string
          description: >-
            The intended downstream task, e.g. RETRIEVAL_DOCUMENT, RETRIEVAL_QUERY,
            SEMANTIC_SIMILARITY, CLASSIFICATION, CLUSTERING.
        title:
          type: string
          description: Optional title for the content (used with RETRIEVAL_DOCUMENT).
        outputDimensionality:
          type: integer
          description: Optional reduced dimension for the output embedding.
      required:
        - content
    EmbedContentResponse:
      type: object
      properties:
        embedding:
          $ref: '#/components/schemas/ContentEmbedding'
    ContentEmbedding:
      type: object
      properties:
        values:
          type: array
          items:
            type: number
            format: float
          description: The embedding vector values.
    PredictRequest:
      type: object
      description: A generic Vertex prediction request (used by predict-based models).
      properties:
        instances:
          type: array
          items:
            type: object
          description: The instances to run prediction on (model-specific shape).
        parameters:
          type: object
          description: Model-specific prediction parameters.
      required:
        - instances
    PredictResponse:
      type: object
      properties:
        predictions:
          type: array
          items:
            type: object
          description: The prediction results (model-specific shape).
        deployedModelId:
          type: string
        model:
          type: string
        modelVersionId:
          type: string
        metadata:
          type: object
    StreamingPredictRequest:
      type: object
      description: A Vertex server-streaming prediction request (tensor-based).
      properties:
        inputs:
          type: array
          items:
            type: object
          description: The input tensors (model-specific shape).
        parameters:
          type: object
          description: The parameter tensor (model-specific shape).
    StreamingPredictResponse:
      type: object
      properties:
        outputs:
          type: array
          items:
            type: object
          description: The output tensors for this stream chunk (model-specific shape).
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string
  securitySchemes:
    gcp.oauth2:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Google service-account OAuth2 bearer token. Generated by the gateway via the
        JWT Bearer assertion grant (urn:ietf:params:oauth:grant-type:jwt-bearer) and
        injected as `Authorization: Bearer <token>`.
security:
  - gcp.oauth2: []
