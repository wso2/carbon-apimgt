openapi: 3.0.3
info:
  title: Google Vertex AI - Gemini API
  description: |-
    This OpenAPI specification defines the RESTful API for invoking Google Gemini
    models hosted on Google Vertex AI, via the `generateContent` and
    `streamGenerateContent` custom methods on the `publishers/google` model resource.

    **Vertex-specific notes:**
    - The target model is identified in the **URL path**
      (`.../models/{model}:generateContent`), not in the request body.
    - Authentication uses a Google service-account OAuth2 bearer token
      (`Authorization: Bearer <token>`), generated by the gateway - not a static API key.
    - `project` and `location` are tenant-specific and are supplied as endpoint
      configuration, hence surfaced here as path/server variables.
    - The response body carries token usage under `usageMetadata`, identical to the
      public Gemini API.
    - `project`, `location` and `publisher` are baked into the backend endpoint URL below,
      so API consumers never see them - they only send `{model}:generateContent`.
    - Edit the endpoint URL: replace `YOUR_PROJECT_ID` with your GCP project and the region
      prefix / `locations` segment (`us-central1`) with your model's location.
  version: "v1"
servers:
  # Full backend base for your deployment. This whole URL is the endpoint the gateway calls;
  # the resource path "/{model}:generateContent" is appended to it. Replace YOUR_PROJECT_ID and
  # the region (us-central1, appearing twice) to match your GCP project and model location.
  # Kept as a plain URL - not OpenAPI server variables - because the gateway seeds the endpoint
  # URL verbatim and does not resolve `{...}` template variables.
  - url: https://us-central1-aiplatform.googleapis.com/v1/projects/YOUR_PROJECT_ID/locations/us-central1/publishers/google/models
paths:
  /{model}:generateContent:
    post:
      operationId: GenerateContent
      summary: Generate content with a Gemini model (unary)
      description: |-
        Sends a content-generation request to the specified Gemini model on Vertex AI
        and returns the complete response in a single payload.
      parameters:
        - name: model
          in: path
          required: true
          description: "The Gemini model identifier, e.g. `gemini-2.5-pro`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContentRequest'
            example:
              contents:
                - role: user
                  parts:
                    - text: "Explain what Vertex AI is in one sentence."
              generationConfig:
                temperature: 0.2
                maxOutputTokens: 256
      responses:
        '200':
          description: Successful response from the model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateContentResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{model}:streamGenerateContent:
    post:
      operationId: StreamGenerateContent
      summary: Generate content with a Gemini model (streaming)
      description: |-
        Sends a content-generation request to the specified Gemini model on Vertex AI
        and receives the response as a stream of `GenerateContentResponse` chunks.
      parameters:
        - name: model
          in: path
          required: true
          description: "The Gemini model identifier, e.g. `gemini-2.5-pro`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContentRequest'
            example:
              contents:
                - role: user
                  parts:
                    - text: "Explain what Vertex AI is in one sentence."
              generationConfig:
                temperature: 0.2
                maxOutputTokens: 256
      responses:
        '200':
          description: Successful streaming response from the model.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenerateContentResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    GenerateContentRequest:
      type: object
      description: A Gemini content-generation request (Vertex variant - no model field in body).
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/Content'
          description: The content of the current conversation with the model.
        systemInstruction:
          $ref: '#/components/schemas/Content'
        tools:
          type: array
          items:
            type: object
          description: A list of tools the model may use to generate the next response.
        generationConfig:
          $ref: '#/components/schemas/GenerationConfig'
        safetySettings:
          type: array
          items:
            type: object
      required:
        - contents
    Content:
      type: object
      properties:
        role:
          type: string
          enum: [user, model]
          description: The producer of the content.
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Part'
      required:
        - parts
    Part:
      type: object
      properties:
        text:
          type: string
          description: Inline text.
    GenerationConfig:
      type: object
      properties:
        temperature:
          type: number
          format: float
        topP:
          type: number
          format: float
        topK:
          type: integer
        maxOutputTokens:
          type: integer
        stopSequences:
          type: array
          items:
            type: string
    GenerateContentResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        modelVersion:
          type: string
          description: The model version that generated the response.
        usageMetadata:
          $ref: '#/components/schemas/UsageMetadata'
    Candidate:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/Content'
        finishReason:
          type: string
          enum: [STOP, MAX_TOKENS, SAFETY, RECITATION, OTHER]
        index:
          type: integer
    UsageMetadata:
      type: object
      properties:
        promptTokenCount:
          type: integer
          description: Number of tokens in the prompt.
        candidatesTokenCount:
          type: integer
          description: Number of tokens in the generated candidates.
        totalTokenCount:
          type: integer
          description: Total token count for the request (prompt + candidates).
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string
  securitySchemes:
    gcp.oauth2:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Google service-account OAuth2 bearer token. Generated by the gateway via the
        JWT Bearer assertion grant (urn:ietf:params:oauth:grant-type:jwt-bearer) and
        injected as `Authorization: Bearer <token>`.
security:
  - gcp.oauth2: []
