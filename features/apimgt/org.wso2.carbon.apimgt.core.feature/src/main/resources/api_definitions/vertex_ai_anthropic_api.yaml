openapi: 3.0.3
info:
  title: Google Vertex AI - Anthropic Claude API
  description: |-
    This OpenAPI specification defines the RESTful API for invoking Anthropic Claude
    models hosted on Google Vertex AI, via the `rawPredict` and `streamRawPredict`
    custom methods on the `publishers/anthropic` model resource.

    Note: the streaming method (`streamRawPredict`) is not delivered incrementally on the
    WSO2 API Manager Classic Gateway - the response is buffered and returned as a whole.

    **Vertex-specific notes:**
    - The target model is identified in the **URL path** (`.../models/{model}:rawPredict`),
      NOT in the request body. The body therefore omits the Anthropic `model` field.
    - The body must include `anthropic_version: "vertex-2023-10-16"` in place of `model`.
    - Authentication uses a Google service-account OAuth2 bearer token
      (`Authorization: Bearer <token>`), generated by the gateway — not a static API key.
    - `project`, `location` and `publisher` are baked into the backend endpoint URL below,
      so API consumers never see them - they only send `{model}:rawPredict`.
    - Edit the endpoint URL: replace `{project_id}` with your GCP project and `{region}`
      (the region prefix and the `locations` segment) with the location where Claude is provisioned.
  version: "vertex-2023-10-16"
servers:
  # Full backend base for your deployment. This whole URL is the endpoint the gateway calls;
  # the resource path "/{model}:rawPredict" is appended to it. Replace the {project_id} and
  # {region} placeholders (region appears twice) with your GCP project and model location.
  # The gateway seeds this URL verbatim and does not resolve the server variables below, so the
  # placeholders are shown as-is for you to edit (the variable defaults are informational only).
  - url: https://{region}-aiplatform.googleapis.com/v1/projects/{project_id}/locations/{region}/publishers/anthropic/models
    variables:
      region:
        default: us-east5
        description: "The Vertex AI region (appears in the host prefix and the locations path segment)."
      project_id:
        default: your-project-id
        description: "Your GCP project ID."
paths:
  /{model}:rawPredict:
    post:
      operationId: RawPredict
      summary: Invoke a Claude model (unary)
      description: |-
        Sends a message request to the specified Anthropic Claude model on Vertex AI
        and returns the complete response in a single payload.
      parameters:
        - name: model
          in: path
          required: true
          description: "The Claude model identifier, e.g. `claude-sonnet-4`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicRequest'
            example:
              anthropic_version: vertex-2023-10-16
              messages:
                - role: user
                  content: "Explain what Vertex AI is in one sentence."
              max_tokens: 256
      responses:
        '200':
          description: Successful response from the model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicResponse'
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{model}:streamRawPredict:
    post:
      operationId: StreamRawPredict
      summary: Invoke a Claude model (streaming)
      description: |-
        Sends a message request to the specified Anthropic Claude model on Vertex AI
        and receives the response as a stream of server-sent events. Set `stream: true`
        in the request body.
      parameters:
        - name: model
          in: path
          required: true
          description: "The Claude model identifier, e.g. `claude-sonnet-4`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicRequest'
            example:
              anthropic_version: vertex-2023-10-16
              messages:
                - role: user
                  content: "Explain what Vertex AI is in one sentence."
              max_tokens: 256
      responses:
        '200':
          description: Successful streaming response from the model.
          content:
            text/event-stream:
              schema:
                type: string
                description: A stream of Anthropic message events (SSE).
        '400':
          description: Invalid argument.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated - missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AnthropicRequest:
      type: object
      description: |-
        Anthropic Messages API request, Vertex variant. Note the absence of a `model`
        field (the model is in the URL path) and the required `anthropic_version`.
      properties:
        anthropic_version:
          type: string
          description: Must be set to `vertex-2023-10-16` for Vertex AI.
          example: vertex-2023-10-16
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: The conversation history.
        system:
          type: string
          description: A system prompt to guide the model's behavior.
        max_tokens:
          type: integer
          description: The maximum number of tokens to generate before stopping.
        temperature:
          type: number
          format: float
          description: Amount of randomness injected into the response (0.0 - 1.0).
        top_p:
          type: number
          format: float
          description: Nucleus sampling probability.
        top_k:
          type: integer
          description: Only sample from the top K options for each subsequent token.
        stop_sequences:
          type: array
          items:
            type: string
          description: Custom text sequences that will cause the model to stop generating.
        stream:
          type: boolean
          description: Whether to stream the response. Use with `:streamRawPredict`.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: Definitions of tools the model may use.
      required:
        - anthropic_version
        - messages
        - max_tokens
    Message:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: The role of the message author.
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentBlock'
          description: The message content, either a plain string or an array of content blocks.
      required:
        - role
        - content
    ContentBlock:
      type: object
      properties:
        type:
          type: string
          enum: [text, image, tool_use, tool_result]
        text:
          type: string
          description: Present when `type` is `text`.
      required:
        - type
    Tool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          description: A JSON schema object defining the tool's input.
      required:
        - name
        - input_schema
    AnthropicResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique object identifier for the response.
        type:
          type: string
          enum: [message]
        role:
          type: string
          enum: [assistant]
        model:
          type: string
          description: The model that handled the request.
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
          description: The content generated by the model.
        stop_reason:
          type: string
          enum: [end_turn, max_tokens, stop_sequence, tool_use]
          description: The reason the model stopped generating.
        stop_sequence:
          type: string
          nullable: true
        usage:
          $ref: '#/components/schemas/TokenUsage'
    TokenUsage:
      type: object
      properties:
        input_tokens:
          type: integer
          description: The number of input (prompt) tokens used.
        output_tokens:
          type: integer
          description: The number of output (completion) tokens generated.
      required:
        - input_tokens
        - output_tokens
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string
  securitySchemes:
    gcp.oauth2:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Google service-account OAuth2 bearer token. Generated by the gateway via the
        JWT Bearer assertion grant (urn:ietf:params:oauth:grant-type:jwt-bearer) and
        injected as `Authorization: Bearer <token>`.
security:
  - gcp.oauth2: []
